name: Build

# Windows-only Tauri build.
#
# - On pull requests and manual runs: builds the app as a smoke test and uploads
#   the NSIS installer as a workflow artifact.
# - On a version tag (v*): builds and publishes it to a GitHub Release.

on:
  push:
    branches: [master]
    tags:
      - "v*"
  pull_request:
    branches: [master]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # needed to create a Release when building a tag

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Cache Rust build artifacts.
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      # Builds the frontend (via beforeBuildCommand), compiles the Rust app, and
      # bundles the NSIS installer. On a v* tag it also drafts a Release.
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing keys for the auto-updater. Set these repo secrets from the keypair
          # generated with `tauri signer generate`. Without them, updater artifacts
          # (the signed .sig + latest.json) are not produced.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && 'SSHDeck __VERSION__' || '' }}
          releaseBody: "See the assets below to download and install. The app can also update itself from the Settings page under Software Update."
          releaseDraft: true
          prerelease: false

      # For PR / manual runs (no tag), keep the installer as a downloadable artifact.
      - name: Upload artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: sshdeck-windows
          path: |
            src-tauri/target/release/bundle/**/*
          if-no-files-found: warn
          retention-days: 7
