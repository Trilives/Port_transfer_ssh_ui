[package]
name = "ssh-port-forwarder"
version = "0.2.5"
description = "A modern visual SSH port forwarding manager for Windows."
authors = ["Codex"]
edition = "2021"

[lib]
name = "ssh_port_forwarder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
directories = "5"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
tauri = { version = "2.0", features = [] }
uuid = { version = "1", features = ["v4", "serde"] }
